function Workflow({project}){

}
function Donut({data}){
  const total=data.reduce((a,b)=>a+b.value,0)||1;
  let a=-Math.PI/2;
  const cx=75,cy=75,r=62,ir=36;
  return <div style={{display:"flex",alignItems:"center",gap:16}}>
    <svg width={150} height={150} style={{flexShrink:0}}>
      {data.map((d,i)=>{
        const sw=(d.value/total)*Math.PI*2;
        const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);
        const x2=cx+r*Math.cos(a+sw),y2=cy+r*Math.sin(a+sw);
        const ix1=cx+ir*Math.cos(a),iy1=cy+ir*Math.sin(a);
        const ix2=cx+ir*Math.cos(a+sw),iy2=cy+ir*Math.sin(a+sw);
        const lg=sw>Math.PI?1:0;
        const path=`M${x1} ${y1}A${r} ${r} 0 ${lg} 1 ${x2} ${y2}L${ix2} ${iy2}A${ir} ${ir} 0 ${lg} 0 ${ix1} ${iy1}Z`;
        a+=sw;
        return <path key={i} d={path} fill={d.color}/>;
      })}
      <text x={cx} y={cy-8} textAnchor="middle" fontSize={22} fontWeight={800} fill="#0f172a">{total}</text>
      <text x={cx} y={cy+12} textAnchor="middle" fontSize={11} fill="#94a3b8">projects</text>
    </svg>
    <div style={{flex:1}}>
      {data.map((d,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
        <div style={{width:10,height:10,borderRadius:3,background:d.color,flexShrink:0}}/>
        <div style={{fontSize:13,color:"#374151",flex:1}}>{d.label}</div>
        <div style={{fontSize:14,fontWeight:800,color:"#0f172a"}}>{d.value}</div>
      </div>)}
    </div>
  </div>;
}
function Bars({data,h=130}){
  const max=Math.max(...data.map(d=>d.value),1);
  return <div style={{display:"flex",gap:8,alignItems:"flex-end",height:h,padding:"0 4px"}}>
    {data.map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>

      <div style={{fontSize:10,color:"#94a3b8",textAlign:"center"}}>{d.label}</div>
    </div>)}
  </div>;
}

function MapCanvas({projects}){
  const ref=useRef(null);
  const [sel,setSel]=useState(null);
  const [hov,setHov]=useState(null);
  const W=700,H=400;
  const LL=[23.17,23.26,77.39,77.48];
  function xy(lat,lng){
    return {
      x:Math.max(30,Math.min(W-30,((lng-LL[2])/(LL[3]-LL[2]))*W)),
      y:Math.max(30,Math.min(H-30,((LL[1]-lat)/(LL[1]-LL[0]))*H))
    };
  }
  function draw(){
    const c=ref.current; if(!c)return;
    const ctx=c.getContext("2d");
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#e8f4f8"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#c8dce6"; ctx.lineWidth=.5;
    for(let i=0;i<W;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(let i=0;i<H;i+=50){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
    const roads=[[[23.185,77.39],[23.19,77.48]],[[23.17,77.43],[23.26,77.43]],
      [[23.22,77.39],[23.22,77.48]],[[23.17,77.46],[23.26,77.46]]];
    ctx.strokeStyle="#b8ccd8"; ctx.lineWidth=2.5;
    roads.forEach(r=>{ctx.beginPath();r.forEach(([la,ln],i)=>{const p=xy(la,ln);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});ctx.stroke();});
    projects.forEach(p=>{
      if(!p.conflicts.length)return;
      const {x,y}=xy(p.lat,p.lng);
      ctx.save();ctx.globalAlpha=.1;ctx.fillStyle="#ef4444";
      ctx.beginPath();ctx.arc(x,y,46,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.5;ctx.strokeStyle="#ef4444";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.arc(x,y,46,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    });
    projects.forEach(p=>{
      const {x,y}=xy(p.lat,p.lng);
      const dept=DEPTS[p.dept];
      const isSel=sel?.id===p.id,isHov=hov===p.id;
      const r=isSel?22:isHov?18:14;
      ctx.save();ctx.globalAlpha=.18;ctx.fillStyle="#000";ctx.beginPath();ctx.arc(x+2,y+3,r,0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.fillStyle=dept.color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      if(isSel){
        ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle=dept.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+6,0,Math.PI*2);ctx.stroke();
      }
      const lbl=p.name.length>16?p.name.slice(0,14)+"…":p.name;
      ctx.font="bold 10px Inter,sans-serif";
      const lw=ctx.measureText(lbl).width+16;
      ctx.fillStyle="rgba(255,255,255,.9)";ctx.fillRect(x-lw/2,y+r+3,lw,16);
      ctx.fillStyle="#1e293b";ctx.textAlign="center";ctx.fillText(lbl,x,y+r+15);
    });
    const lh=Object.keys(DEPTS).length*15+28;
    ctx.fillStyle="rgba(255,255,255,.93)";ctx.beginPath();
    ctx.roundRect(8,H-lh-8,160,lh,8);ctx.fill();
    ctx.strokeStyle="#e5e7eb";ctx.lineWidth=.5;ctx.beginPath();ctx.roundRect(8,H-lh-8,160,lh,8);ctx.stroke();
    ctx.font="bold 11px Inter,sans-serif";ctx.fillStyle="#374151";ctx.textAlign="left";ctx.fillText("DEPARTMENTS",16,H-lh+16);
    Object.values(DEPTS).forEach((d,i)=>{
      const ly=H-lh+32+i*15;
      ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(22,ly-4,5,0,Math.PI*2);ctx.fill();
      ctx.font="10px Inter,sans-serif";ctx.fillStyle="#374151";ctx.fillText(d.label,32,ly);
    });
  }
  useEffect(()=>{draw();},[projects,sel,hov]);
  function click(e){
    const rect=ref.current.getBoundingClientRect(),sc=W/rect.width;
    const cx=(e.clientX-rect.left)*sc,cy=(e.clientY-rect.top)*sc;
    for(const p of projects){const{x,y}=xy(p.lat,p.lng);if(Math.hypot(cx-x,cy-y)<26){setSel(sel?.id===p.id?null:p);return;}}
    setSel(null);
  }
  function move(e){
    const rect=ref.current.getBoundingClientRect(),sc=W/rect.width;
    const cx=(e.clientX-rect.left)*sc,cy=(e.clientY-rect.top)*sc;
    let f=null;for(const p of projects){const{x,y}=xy(p.lat,p.lng);if(Math.hypot(cx-x,cy-y)<22){f=p.id;break;}}
    setHov(f);ref.current.style.cursor=f?"pointer":"default";
  }
  return <div style={{position:"relative"}}>
    <canvas ref={ref} width={W} height={H} onClick={click} onMouseMove={move}
      style={{width:"100%",height:"auto",borderRadius:12,border:"1px solid #e5e7eb",display:"block"}}/>
    {sel&&<div style={{position:"absolute",top:12,right:12,background:"#fff",border:"1px solid #e5e7eb",
      borderRadius:14,padding:"14px 18px",width:248,boxShadow:"0 8px 24px rgba(0,0,0,.14)",zIndex:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{fontWeight:700,fontSize:14,color:"#111827",lineHeight:1.3,maxWidth:200}}>{sel.name}</div>
        <button onClick={e=>{e.stopPropagation();setSel(null);}}
          style={{background:"none",border:"none",cursor:"pointer",color:"#9ca3af",fontSize:18,padding:0,lineHeight:1}}>✕</button>
      </div>
      <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
        <Badge text={sel.status} color={sc(sel.status)} bg={sb(sel.status)}/>
        <Badge text={sel.priority} color={pc(sel.priority)} bg={pc(sel.priority)+"18"}/>
      </div>
      <div style={{marginTop:10,fontSize:12,color:"#6b7280"}}>{DEPTS[sel.dept].icon} {DEPTS[sel.dept].label}</div>
      <div style={{fontSize:12,color:"#6b7280",marginTop:3}}>📍 {sel.location}</div>
      <div style={{marginTop:10}}>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>{sel.progress}% complete</div>
        <Bar value={sel.progress} color={DEPTS[sel.dept].color}/>
      </div>
      {sel.conflicts.length>0&&<div style={{marginTop:10,background:"#fee2e2",borderRadius:8,
        padding:"6px 10px",fontSize:12,color:"#991b1b"}}>⚠️ {sel.conflicts.length} conflict(s) detected</div>}
    </div>}
  </div>;
}

function ConflictCard({p1,p2}){
  return <Card style={{borderLeft:"4px solid #ef4444"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>⚠️ Location & Timeline Conflict</div>

    </div>
    <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:12,alignItems:"center"}}>
      {[p1,p2].map((p,i)=><React.Fragment key={i}>
        {i===1&&<div style={{textAlign:"center",color:"#dc2626",fontWeight:800,fontSize:22}}>⟷</div>}
        <div style={{background:DEPTS[p.dept].light,borderRadius:10,padding:"10px 14px"}}>
          <div style={{fontSize:11,color:DEPTS[p.dept].color,fontWeight:700}}>{DEPTS[p.dept].icon} {DEPTS[p.dept].label}</div>
          <div style={{fontWeight:700,fontSize:13,marginTop:4,color:"#1e293b"}}>{p.name}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{p.start} → {p.end}</div>
        </div>
      </React.Fragment>)}
    </div>
    <div style={{marginTop:14,background:"#f8fafc",borderRadius:10,padding:"10px 14px"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:6}}>🔍 Conflict Details</div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
        {["📍 Same road corridor","📅 Overlapping dates","⛏️ Both require excavation"].map((t,i)=>
          <div key={i} style={{fontSize:12,color:"#4b5563"}}>{t}</div>)}
      </div>
    </div>
    <div style={{marginTop:12,background:"#eff6ff",borderRadius:10,padding:"10px 14px"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#1d4ed8",marginBottom:4}}>💡 Recommended Action</div>
      <div style={{fontSize:12,color:"#1e40af",lineHeight:1.6}}>
        Schedule <strong>{p2.name}</strong> after <strong>{p1.name}</strong> completes (post-Oct 2026),
        or coordinate a joint excavation window — estimated 60% reduction in citizen disruption and ₹8–12L rework savings.
      </div>
    </div>
    <div style={{marginTop:12,display:"flex",gap:10,flexWrap:"wrap"}}>
      {[["📅 Reschedule","#eff6ff","#bfdbfe","#2563eb"],
        ["🤝 Joint Coordination","#f0fdf4","#bbf7d0","#15803d"],
        ["🚨 Escalate","#fff7ed","#fed7aa","#c2410c"]]
        .map(([t,bg,br,fc],i)=><button key={i} style={{flex:1,minWidth:110,background:bg,border:"1px solid "+br,
          borderRadius:8,padding:"8px 0",fontSize:12,color:fc,fontWeight:700,cursor:"pointer"}}>{t}</button>)}
    </div>
  </Card>;
}

function App(){
  const [page,setPage]=useState("Dashboard");
  const [projects,setProjects]=useState(INIT_PROJECTS);
  const [notifs,setNotifs]=useState(INIT_NOTIFS);
  const [sidebar,setSidebar]=useState(true);
  const [notifOpen,setNotifOpen]=useState(false);
  const [newProj,setNewProj]=useState(null);
  const [selProj,setSelProj]=useState(null);
  const [fSt,setFSt]=useState("all");
  const [fDept,setFDept]=useState("all");
  const [feedback,setFeedback]=useState("");
  const [fbSent,setFbSent]=useState(false);
  const [toast,setToast]=useState(null);

  const unread=notifs.filter(n=>!n.read).length;
  const pending=projects.filter(p=>p.status==="pending");
  const pairs=[];const seen=new Set();
  projects.forEach(p=>p.conflicts.forEach(cid=>{
    const k=[p.id,cid].sort().join("-");
    if(!seen.has(k)){seen.add(k);const o=projects.find(x=>x.id===cid);if(o)pairs.push([p,o]);}
  }));

  function showToast(msg,type="ok"){setToast({msg,type});setTimeout(()=>setToast(null),3000);}

  function approve(id){
    setProjects(ps=>ps.map(p=>p.id===id?{...p,status:"active"}:p));
    setNotifs(ns=>[{id:Date.now(),type:"success",title:"Project Approved",
      msg:projects.find(p=>p.id===id)?.name+" approved and scheduled.",time:"just now",read:false},...ns]);
    showToast("Project approved ✅");
  }
  function reject(id){setProjects(ps=>ps.map(p=>p.id===id?{...p,status:"rejected"}:p));showToast("Project rejected","err");}

  const filtered=projects.filter(p=>(fSt==="all"||p.status===fSt)&&(fDept==="all"||p.dept===fDept));
  const dStats=Object.keys(DEPTS).map(k=>({dept:k,count:projects.filter(p=>p.dept===k).length,color:DEPTS[k].color}));

  return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>

    {toast&&<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",

          <div style={{width:36,height:36,borderRadius:10,background:"#1e40af",display:"flex",
            alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🏙️</div>
          {sidebar&&<div>
            <div style={{fontWeight:800,fontSize:13,color:"#f1f5f9",letterSpacing:.5}}>UDCP</div>
            <div style={{fontSize:10,color:"#475569"}}>Bhopal Smart City</div>
          </div>}
        </div>
      </div>
      <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
        {PAGES.map(p=>{
          const act=page===p;
          const badge=(p==="Conflicts"&&pairs.length)||(p==="Notifications"&&unread)||(p==="Approvals"&&pending.length)||0;
          return <button key={p} onClick={()=>setPage(p)} style={{display:"flex",alignItems:"center",gap:10,
            width:"100%",padding:"8px 10px",borderRadius:10,border:"none",cursor:"pointer",marginBottom:2,
            background:act?"#1e40af":"transparent",color:act?"#fff":"#64748b",textAlign:"left"}}>
            <span style={{fontSize:17,flexShrink:0,width:22,textAlign:"center"}}>{ICONS[p]}</span>
            {sidebar&&<span style={{fontSize:13,fontWeight:act?700:500}}>{p}</span>}
            {badge>0&&sidebar&&<span style={{marginLeft:"auto",background:p==="Conflicts"?"#ef4444":"#3b82f6",
              color:"#fff",borderRadius:99,fontSize:10,fontWeight:700,padding:"1px 7px"}}>{badge}</span>}
          </button>;
        })}
      </nav>
      <div style={{padding:"10px 8px",borderTop:"1px solid #1e293b"}}>
        <button onClick={()=>setSidebar(s=>!s)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",
          padding:"7px 10px",borderRadius:8,border:"none",cursor:"pointer",background:"transparent",
          color:"#475569",fontSize:13}}>
          <span>{sidebar?"◀":"▶"}</span>{sidebar&&<span>Collapse</span>}
        </button>
        {sidebar&&<div style={{marginTop:8,padding:"8px 10px",background:"#1e293b",borderRadius:10}}>
          <div style={{fontSize:10,color:"#475569"}}>Logged in as</div>
          <div style={{fontSize:13,color:"#e2e8f0",fontWeight:700,marginTop:1}}>Admin · Bhopal MC</div>
          <div style={{fontSize:10,color:"#22c55e",marginTop:2}}>● Online</div>
        </div>}
      </div>
    </div>

    {/* MAIN */}
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>

      {/* TOPBAR */}

          <div style={{fontWeight:800,fontSize:16,color:"#0f172a"}}>{page}</div>

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {pairs.length>0&&<div style={{background:"#fee2e2",color:"#991b1b",borderRadius:8,

            ⚠️ {pairs.length} Active Conflict{pairs.length>1?"s":""}
          </div>}
          <div style={{position:"relative"}}>
            <button onClick={()=>setNotifOpen(n=>!n)} style={{width:38,height:38,borderRadius:10,

              display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>

            </button>
            {notifOpen&&<div style={{position:"absolute",top:46,right:0,background:"#fff",border:"1px solid #e5e7eb",

              <div style={{padding:"12px 16px 10px",borderBottom:"1px solid #f3f4f6",

              <div style={{maxHeight:300,overflowY:"auto"}}>

                      <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{n.time}</div>
                    </div>
                  </div>
                </div>)}
              </div>
            </div>}
          </div>
          <div style={{width:36,height:36,borderRadius:10,background:"#dbeafe",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👤</div>
        </div>

                {label:"Pending",  value:projects.filter(p=>p.status==="pending").length,   color:"#d97706"},
                {label:"Approved", value:projects.filter(p=>p.status==="approved").length,  color:"#2563eb"},

            <Card>
              <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:14}}>By Department</div>

                </div>)}
              </div>
            </Card>

                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{DEPTS[p.dept].icon}</div>

                  <div style={{fontWeight:600,fontSize:13,color:"#111827",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
                  <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>{DEPTS[p.dept].label}</div>

                </div>
                <Badge text={p.status} color={sc(p.status)} bg={sb(p.status)}/>
              </div>)}
            </Card>
            <Card>
              <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:12}}>Recent Activity</div>

                borderBottom:"1px solid #f8fafc",alignItems:"flex-start"}}>
                <span style={{fontSize:18,flexShrink:0}}>{n.type==="conflict"?"⚠️":n.type==="approval"?"📋":n.type==="success"?"✅":"🔔"}</span>

                  <div style={{fontSize:13,fontWeight:600,color:"#111827"}}>{n.title}</div>
                  <div style={{fontSize:12,color:"#6b7280",lineHeight:1.4}}>{n.msg.slice(0,56)}{n.msg.length>56?"…":""}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{n.time}</div>
                </div>
              </div>)}
            </Card>
          </div>
          <Card style={{background:"#0f172a",border:"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:14}}>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:"#f1f5f9"}}>🏙️ Smart City Impact — Coordination vs Silos</div>
                <div style={{fontSize:12,color:"#64748b",marginTop:2}}>Estimated outcomes of using UDCP</div>
              </div>
              <div style={{display:"flex",gap:24}}>
                {[["₹42L+","Rework cost avoided","#22c55e"],["3 roads","Re-excavation prevented","#38bdf8"],["~60%","Citizen disruption reduced","#a78bfa"]]
                  .map(([v,l,c],i)=><div key={i} style={{textAlign:"center"}}>
                    <div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div>
                    <div style={{fontSize:11,color:"#64748b",maxWidth:90,lineHeight:1.3}}>{l}</div>
                  </div>)}
              </div>
            </div>
          </Card>
        </div>}

        {/* ── PROJECTS ─────────────────────────────────── */}
        {page==="Projects"&&<div>
          <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
            <select value={fSt} onChange={e=>setFSt(e.target.value)} style={sel}>
              <option value="all">All Status</option>
              {["active","pending","approved","completed","rejected"].map(s=><option key={s} value={s}>{s.charAt(0).toUpperCase()+s.slice(1)}</option>)}
            </select>
            <select value={fDept} onChange={e=>setFDept(e.target.value)} style={sel}>
              <option value="all">All Departments</option>
              {Object.entries(DEPTS).map(([k,v])=><option key={k} value={k}>{v.icon} {v.label}</option>)}
            </select>
            <div style={{fontSize:13,color:"#6b7280",marginLeft:4}}>{filtered.length} result{filtered.length!==1?"s":""}</div>
            <button onClick={()=>setNewProj({})} style={{marginLeft:"auto",padding:"8px 18px",background:"#2563eb",
              color:"#fff",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:13}}>+ New Project</button>
          </div>

          {newProj&&<Card style={{marginBottom:16,border:"2px solid #bfdbfe"}}>
            <div style={{fontWeight:700,fontSize:15,color:"#1d4ed8",marginBottom:14}}>➕ Register New Project</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              {[{l:"Project Name",k:"name",ph:"e.g. Habibganj Underpass Repair"},
                {l:"Assigned Officer",k:"officer",ph:"Officer full name"}].map(f=><div key={f.k}>
                <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>{f.l}</label>
                <input value={newProj[f.k]||""} onChange={e=>setNewProj(p=>({...p,[f.k]:e.target.value}))}
                  placeholder={f.ph} style={inp}/>
              </div>)}
              {[{l:"Department",k:"dept",opts:[["","Select department"],...Object.entries(DEPTS).map(([k,v])=>[k,v.icon+" "+v.label])]},
                {l:"Priority",k:"priority",opts:[["","Select priority"],["high","🔴 High"],["medium","🟡 Medium"],["low","🟢 Low"]]}]
                .map(f=><div key={f.k}>
                <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>{f.l}</label>
                <select value={newProj[f.k]||""} onChange={e=>setNewProj(p=>({...p,[f.k]:e.target.value}))}
                  style={{...inp}}>{f.opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
              </div>)}
              {[{l:"Start Date",k:"start"},{l:"End Date",k:"end"}].map(f=><div key={f.k}>
                <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>{f.l}</label>
                <input type="date" value={newProj[f.k]||""} onChange={e=>setNewProj(p=>({...p,[f.k]:e.target.value}))} style={inp}/>
              </div>)}
            </div>
            <div style={{marginTop:12}}>
              <label style={{fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>Description</label>
              <textarea value={newProj.description||""} onChange={e=>setNewProj(p=>({...p,description:e.target.value}))}

                style={{...inp,resize:"vertical",minHeight:60}}/>

            <div style={{marginTop:14,display:"flex",gap:10}}>
              <button onClick={()=>{

                const id=Date.now();
                setProjects(ps=>[...ps,{...newProj,id,status:"pending",progress:0,conflicts:[],budget:1000000,lat:23.22,lng:77.44}]);
                setNotifs(ns=>[{id,type:"info",title:"New Project Submitted",msg:newProj.name+" submitted for review.",time:"just now",read:false},...ns]);
                setNewProj(null);showToast("Project submitted for approval 📋");

                padding:"9px 22px",fontWeight:700,cursor:"pointer",fontSize:13}}>Submit for Approval</button>
              <button onClick={()=>setNewProj(null)} style={{background:"#f1f5f9",color:"#374151",border:"none",
                borderRadius:8,padding:"9px 18px",cursor:"pointer",fontSize:13}}>Cancel</button>
            </div>
          </Card>}

          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {filtered.map(p=><Card key={p.id} onClick={()=>setSelProj(selProj?.id===p.id?null:p)}>
              <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
                <div style={{width:46,height:46,borderRadius:12,background:DEPTS[p.dept].light,
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{DEPTS[p.dept].icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                    <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>{p.name}</div>
                    <Badge text={p.status} color={sc(p.status)} bg={sb(p.status)}/>
                    <Badge text={p.priority} color={pc(p.priority)} bg={pc(p.priority)+"18"}/>
                    {p.conflicts.length>0&&<Badge text="⚠️ Conflict" color="#991b1b" bg="#fee2e2"/>}
                  </div>
                  <div style={{display:"flex",gap:16,marginTop:5,flexWrap:"wrap"}}>
                    {[DEPTS[p.dept].icon+" "+DEPTS[p.dept].label,"📍 "+p.location,"📅 "+p.start+" → "+p.end,"💰 ₹"+(p.budget/1e5).toFixed(1)+"L"]
                      .map((t,i)=><div key={i} style={{fontSize:12,color:"#6b7280"}}>{t}</div>)}
                  </div>
                  <div style={{marginTop:10,display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}><Bar value={p.progress} color={DEPTS[p.dept].color}/></div>

                  </div>

              </div>

                <div style={{fontSize:13,color:"#4b5563",lineHeight:1.6,marginBottom:10}}>{p.description}</div>

                ["⛏️","Excavation Conflict","Multiple departments digging the same road = duplicate cost + citizen disruption."]]

        {/* ── APPROVALS ────────────────────────────────── */}
        {page==="Approvals"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          {pending.length===0
            ?<Card style={{textAlign:"center",padding:56}}>
              <div style={{fontSize:52,marginBottom:10}}>✅</div>
              <div style={{fontWeight:800,fontSize:18,color:"#059669"}}>No Pending Approvals</div>
              <div style={{fontSize:13,color:"#6b7280",marginTop:6}}>All submitted projects have been reviewed.</div>
            </Card>
            :pending.map(p=><Card key={p.id} style={{borderLeft:"4px solid #d97706"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>{p.name}</div>
                  <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>{DEPTS[p.dept].icon} {DEPTS[p.dept].label} · 👷 {p.officer}</div>
                  <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>📅 {p.start} → {p.end} · 💰 ₹{(p.budget/1e5).toFixed(1)}L</div>
                  {p.conflicts.length>0&&<div style={{marginTop:8,background:"#fee2e2",borderRadius:8,
                    padding:"6px 10px",fontSize:12,color:"#991b1b",display:"inline-block"}}>
                    ⚠️ {p.conflicts.length} conflict(s) detected — review carefully before approving.
                  </div>}
                </div>
                <Badge text="Pending" color={sc("pending")} bg={sb("pending")}/>
              </div>
              <div style={{marginTop:12}}>
                <div style={{fontWeight:700,fontSize:13,color:"#374151",marginBottom:6}}>Approval Workflow</div>
                <Workflow project={p}/>
              </div>
              <div style={{marginTop:14,display:"flex",gap:10,flexWrap:"wrap"}}>
                <button onClick={()=>approve(p.id)} style={{background:"#059669",color:"#fff",border:"none",
                  borderRadius:8,padding:"9px 22px",fontWeight:700,cursor:"pointer",fontSize:13}}>✅ Approve & Schedule</button>
                <button onClick={()=>reject(p.id)} style={{background:"#fee2e2",color:"#dc2626",border:"1px solid #fecaca",
                  borderRadius:8,padding:"9px 22px",fontWeight:700,cursor:"pointer",fontSize:13}}>❌ Reject</button>
                <button style={{background:"#fff7ed",color:"#c2410c",border:"1px solid #fed7aa",
                  borderRadius:8,padding:"9px 18px",cursor:"pointer",fontSize:13,fontWeight:600}}>📝 Request More Info</button>
              </div>
            </Card>)}
        </div>}

        {/* ── ANALYTICS ────────────────────────────────── */}
        {page==="Analytics"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
            <StatCard icon="✅" label="Completion Rate"    value="83%"    sub="↑12% vs last quarter" color="#059669"/>
            <StatCard icon="⚠️" label="Conflict Reduction" value="−38%"   sub="From Q1 2026"         color="#7c3aed"/>
            <StatCard icon="💰" label="Budget Saved"       value="₹18L"   sub="Via coordination"     color="#2563eb"/>
            <StatCard icon="😊" label="Citizen Score"      value="76/100" sub="Public satisfaction"  color="#d97706"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <Card>
              <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:14}}>Department Progress</div>
              {Object.entries(DEPTS).map(([k,v])=>{
                const dp=projects.filter(p=>p.dept===k);
                const avg=dp.length?Math.round(dp.reduce((a,b)=>a+b.progress,0)/dp.length):0;
                return <div key={k} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <div style={{fontSize:13,color:"#374151"}}>{v.icon} {v.label}</div>
                    <div style={{fontSize:13,fontWeight:800,color:v.color}}>{avg}%</div>
                  </div>
                  <Bar value={avg} color={v.color}/>
                </div>;
              })}
            </Card>
            <Card>
              <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:14}}>Budget Utilization</div>
              {projects.slice(0,5).map(p=>{
                const used=Math.round(p.progress*p.budget/100);
                return <div key={p.id} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <div style={{fontSize:12,color:"#374151",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"65%"}}>{p.name}</div>
                    <div style={{fontSize:11,fontWeight:700,color:"#374151",flexShrink:0}}>₹{(used/1e5).toFixed(1)}L / ₹{(p.budget/1e5).toFixed(1)}L</div>
                  </div>
                  <Bar value={p.progress} color={DEPTS[p.dept].color}/>
                </div>;
              })}
            </Card>
          </div>
          <Card>
            <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:14}}>📊 Project Activity — 2026</div>
            <Bars h={150} data={[
              {label:"Jan",value:2,color:"#93c5fd"},{label:"Feb",value:3,color:"#60a5fa"},
              {label:"Mar",value:5,color:"#3b82f6"},{label:"Apr",value:6,color:"#2563eb"},
              {label:"May",value:4,color:"#1d4ed8"},{label:"Jun",value:7,color:"#1e40af"},
              {label:"Jul",value:5,color:"#1e3a8a"},{label:"Aug",value:6,color:"#172554"},
            ]}/>
            <div style={{textAlign:"center",fontSize:12,color:"#94a3b8",marginTop:8}}>Projects initiated per month</div>
          </Card>
        </div>}

        {/* ── NOTIFICATIONS ────────────────────────────── */}
        {page==="Notifications"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <div style={{fontSize:13,color:"#6b7280",fontWeight:500}}>{unread} unread</div>
            <button onClick={()=>setNotifs(ns=>ns.map(n=>({...n,read:true})))}
              style={{background:"none",border:"none",color:"#2563eb",cursor:"pointer",fontWeight:700,fontSize:13}}>Mark all as read</button>
          </div>
          {notifs.map(n=>{
            const lc={conflict:"#ef4444",success:"#059669",warning:"#d97706",approval:"#2563eb",info:"#2563eb"}[n.type]||"#2563eb";
            return <Card key={n.id} style={{borderLeft:"4px solid "+lc,background:n.read?"#fff":"#eff6ff"}}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <span style={{fontSize:26,flexShrink:0}}>{n.type==="conflict"?"⚠️":n.type==="approval"?"📋":n.type==="success"?"✅":n.type==="warning"?"🔔":"ℹ️"}</span>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <div style={{fontWeight:700,fontSize:14,color:"#111827"}}>{n.title}</div>
                    {!n.read&&<span style={{width:8,height:8,background:"#3b82f6",borderRadius:"50%",marginTop:6,flexShrink:0}}/>}
                  </div>
                  <div style={{fontSize:13,color:"#4b5563",marginTop:4,lineHeight:1.55}}>{n.msg}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:6}}>⏰ {n.time}</div>
                </div>
              </div>
            </Card>;
          })}
        </div>}

        {/* ── AUDIT LOGS ───────────────────────────────── */}
        {page==="Audit Logs"&&<Card>
          <div style={{fontWeight:700,fontSize:14,color:"#0f172a",marginBottom:14}}>📜 System Audit Trail</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}>
              <thead>
                <tr style={{background:"#f8fafc"}}>
                  {["Timestamp","User","Role","Action","Target"].map(h=><th key={h} style={{padding:"10px 14px",
                    textAlign:"left",fontSize:11,fontWeight:700,color:"#6b7280",borderBottom:"1px solid #e5e7eb",
                    textTransform:"uppercase",letterSpacing:.5,whiteSpace:"nowrap"}}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {AUDIT.map(l=><tr key={l.id} style={{borderBottom:"1px solid #f8fafc"}}>
                  <td style={{padding:"10px 14px",fontSize:12,color:"#6b7280",whiteSpace:"nowrap"}}>{l.time}</td>
                  <td style={{padding:"10px 14px",fontSize:13,fontWeight:700,color:"#111827"}}>{l.user}</td>
                  <td style={{padding:"10px 14px"}}>
                    <Badge text={l.role} color={l.role==="System"?"#7c3aed":l.role==="Admin"?"#1d4ed8":"#374151"}
                      bg={l.role==="System"?"#ede9fe":l.role==="Admin"?"#dbeafe":"#f3f4f6"}/>
                  </td>
                  <td style={{padding:"10px 14px",fontSize:13,color:"#374151"}}>{l.action}</td>
                  <td style={{padding:"10px 14px",fontSize:13,color:"#2563eb",fontWeight:600}}>{l.target}</td>
                </tr>)}
              </tbody>
            </table>
          </div>
        </Card>}

        {/* ── CITIZEN PORTAL ───────────────────────────── */}
        {page==="Citizen Portal"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Card style={{background:"#0f172a",border:"none",padding:"24px 28px"}}>
            <div style={{fontWeight:800,fontSize:20,color:"#f1f5f9",marginBottom:6}}>🏙️ Bhopal Smart City — Public Project Portal</div>
            <div style={{fontSize:13,color:"#64748b",lineHeight:1.6,maxWidth:600}}>
              Stay informed about infrastructure projects in your city. Track progress, view road closures, and share feedback with the Municipal Corporation.
            </div>
            <div style={{display:"flex",gap:16,marginTop:18,flexWrap:"wrap"}}>
              {[[projects.filter(p=>p.status==="active").length,"🔄","Active Projects"],
                [3,"🛣️","Road Closures"],[projects.length,"📋","Projects in 2026"]]
                .map(([v,ic,l],i)=><div key={i} style={{background:"rgba(255,255,255,.08)",borderRadius:14,
                  padding:"14px 22px",textAlign:"center"}}>
                  <div style={{fontSize:20}}>{ic}</div>
                  <div style={{fontSize:26,fontWeight:800,color:"#f1f5f9",marginTop:2}}>{v}</div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:1}}>{l}</div>
                </div>)}
            </div>
          </Card>
          <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>🚧 Projects Currently Active in Bhopal</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
            {projects.filter(p=>p.status==="active").map(p=><Card key={p.id}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{fontSize:28,flexShrink:0}}>{DEPTS[p.dept].icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:"#111827"}}>{p.name}</div>
                  <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{DEPTS[p.dept].label}</div>
                  <div style={{fontSize:12,color:"#6b7280"}}>📍 {p.location}</div>
                  <div style={{fontSize:12,color:"#6b7280"}}>🗓️ Ends {p.end}</div>
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:11,color:"#9ca3af",marginBottom:3}}>{p.progress}% complete</div>
                    <Bar value={p.progress} color={DEPTS[p.dept].color}/>
                  </div>
                  <div style={{marginTop:8}}><Badge text={p.status} color={sc(p.status)} bg={sb(p.status)}/></div>
                </div>
              </div>
            </Card>)}
          </div>
          <Card>
            <div style={{fontWeight:700,fontSize:15,color:"#111827",marginBottom:8}}>📝 Submit Feedback</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Report a road issue or share feedback about any infrastructure project in your area.</div>
            {fbSent
              ?<div style={{background:"#f0fdf4",borderRadius:10,padding:"14px 18px",color:"#15803d",fontWeight:700,fontSize:14}}>
                ✅ Thank you! Your feedback has been received by Bhopal Municipal Corporation.
              </div>
              :<div>
                <textarea value={feedback} onChange={e=>setFeedback(e.target.value)}
                  placeholder="Describe the issue or share your experience…"
                  style={{width:"100%",minHeight:100,padding:"10px 14px",borderRadius:10,border:"1px solid #e5e7eb",
                  fontSize:13,resize:"vertical",boxSizing:"border-box",outline:"none"}}/>
                <button disabled={!feedback.trim()}
                  onClick={()=>{setFbSent(true);setFeedback("");setTimeout(()=>setFbSent(false),4000);}}
                  style={{marginTop:10,background:feedback.trim()?"#2563eb":"#e5e7eb",
                  color:feedback.trim()?"#fff":"#9ca3af",border:"none",borderRadius:8,
                  padding:"9px 22px",fontWeight:700,cursor:feedback.trim()?"pointer":"default",fontSize:13}}>
                  Submit Feedback
                </button>
              </div>}
          </Card>
        </div>}

      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
